<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planer</title>
    <!--
      La marca en pequeno: el punto del logotipo, a pantalla completa (ver
      `web/public/favicon.svg`). El `.ico` y el `.png` de Apple salen de ese
      mismo SVG. El `.ico` va primero por los navegadores que no leen SVG, y
      el de Apple porque iOS no usa ninguno de los dos.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Los iconos son una fuente: ver `shared/icons.ts`. Esta en
      `web/public/iconos/`, asi que la sirve el propio Planer y no se le pide
      nada a un servidor de fuera.

      La fuente se pide a la misma vez que su hoja, sin esperar a que esta se
      lea: son novecientos y pico kilobytes, y hasta que llegan el navegador
      dibuja cada icono con el glifo que le toque en la fuente del sistema. El
      `crossorigin` no es opcional --una fuente se pide siempre con CORS, ni
      siendo del mismo sitio, y sin el la descarga adelantada no se aprovecha--.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/iconos/iconos.woff2" crossorigin />
    <link rel="stylesheet" href="/iconos/iconos.css" />
    <!--
      La letra del panel y su monoespaciada (ver `--font-family` y
      `--font-mono` en `styles/theme.css`), servidas por el propio servidor:
      ver `public/fuentes/fuentes.css`.
    -->
    <link rel="preload" href="/fuentes/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fuentes/fuentes.css" />
    <script>
      // Aplicamos el tema, el tamano de letra y la paleta antes de pintar para que no haya parpadeo.
      (() => {
        const saved = localStorage.getItem("plane-theme");
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        // Siempre puesto, tambien cuando manda el sistema: es de donde salen
        // el recorte de la paleta y el vestido de los campos.
        document.documentElement.dataset.theme = dark ? "dark" : "light";

        // Tamano de letra: un porcentaje entre 80 y 160, como `font-size`
        // de la raiz; con 100 manda el tamano del navegador.
        const font = Number(localStorage.getItem("plane-font-size"));
        if (font >= 80 && font <= 160 && font % 10 === 0 && font !== 100) {
          document.documentElement.style.fontSize = `${font}%`;
        }

        // La paleta del panel, la última que vio este navegador. La de verdad
        // está en la cuenta; ver `lib/panelPalette.svelte.ts`.
        try {
          const brand = JSON.parse(localStorage.getItem("plane-panel-palette") || "null");
          const id = brand && typeof brand.palette === "string" ? brand.palette : "";
          const color = brand && /^#[0-9a-f]{6}$/i.test(brand.color || "") ? brand.color : "";
          // `custom` sin su color rompería todos los tokens derivados: se omite.
          // Una aplicación publicada (/p/...) no es el panel: no lleva su paleta.
          const published = /^\/p(\/|$)/.test(location.pathname);
          if (!published && /^[a-z0-9-]+$/.test(id) && (id !== "custom" || color)) {
            document.documentElement.dataset.palette = id;
            if (color) document.documentElement.style.setProperty("--palette-1", color);
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
