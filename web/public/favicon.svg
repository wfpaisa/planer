<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Planer">
  <!--
    La marca en pequeno: el punto del logotipo, solo.

    Es la misma pieza que cierra la palabra en `assets/planer-logo.svg`, aqui
    a pantalla completa. Al ser color propio no depende del tema: un solo
    archivo vale para pestana clara y oscura.

    El `.ico` y el de Apple que hay al lado se sacan de este mismo dibujo (ver
    el comentario de `index.html`).
  -->
  <circle cx="16" cy="16" r="16" fill="#0d31d0" />
</svg>
